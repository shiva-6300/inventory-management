<div class="form-group">
    <label for="name">Product Name</label>
    <input type="text" id="name" name="name" value="{{ form.name }}" maxlength="150" required>
</div>
<div class="form-row">
    <div class="form-group">
        <label for="category_id">Category</label>
        <select id="category_id" name="category_id" required>
            <option value="">-- Select category --</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if form.category_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="supplier">Supplier</label>
        <input type="text" id="supplier" name="supplier" value="{{ form.supplier }}" maxlength="150">
    </div>
</div>
<div class="form-row form-row-3">
    <div class="form-group">
        <label for="price">Price</label>
        <input type="number" id="price" name="price" value="{{ form.price }}" min="0" step="0.01" required>
    </div>
    <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="{{ form.quantity }}" min="0" step="1" required>
    </div>
    <div class="form-group">
        <label for="minimum_stock">Minimum Stock Level</label>
        <input type="number" id="minimum_stock" name="minimum_stock" value="{{ form.minimum_stock }}" min="0" step="1" required>
    </div>
</div>
