{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Product #{{ product.id }}</h1>
    <a class="btn btn-outline" href="{{ url_for('products.list_products') }}">&larr; Back</a>
</div>
<div class="card form-card">
    <form method="post" action="{{ url_for('products.edit_product', product_id=product.id) }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% include "_product_form.html" %}
        <p class="muted small">Tip: use Stock In / Stock Out to change quantity so the change is recorded in the stock history.</p>
        <button type="submit" class="btn btn-primary">Update Product</button>
    </form>
</div>
{% endblock %}
